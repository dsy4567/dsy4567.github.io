			let 参数 = new URLSearchParams(location.search).get("no-redirect");
			参数 ??= "";
			// noscript：脚本既然跑起来了就说明 JS 可用（如从书签打开），送去完整版；unsupported：完整版的脚本已确认跑不起来，再跳过去只会来回弹
			if (参数 === "noscript") location.replace("/blog.html");
			else if (参数 !== "unsupported") {
				const 完整版链接 = document.createElement("a");
				完整版链接.href = "/blog.html";
				完整版链接.textContent = "点击这里访问完整版，体验更佳";
				完整版链接.style.cssText =
					"background: #000; color: #66ccff; display: block; margin-top: 1em; padding: 1em; text-align: center; text-decoration: none;";
				document.body.prepend(完整版链接);
			}
